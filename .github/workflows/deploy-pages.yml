name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: /behindbars

      - name: Fix public asset URLs in exported HTML
        run: |
          find ./out -type f \( -name '*.html' -o -name '*.txt' \) -print0 | xargs -0 sed -i \
            -e 's#src="/images/#src="/behindbars/images/#g' \
            -e 's#srcset="/images/#srcset="/behindbars/images/#g' \
            -e 's#url(/images/#url(/behindbars/images/#g' \
            -e 's#url("/images/#url("/behindbars/images/#g' \
            -e "s#url('/images/#url('/behindbars/images/#g"

  
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
